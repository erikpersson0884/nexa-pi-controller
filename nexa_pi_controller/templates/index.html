<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<meta name="theme-color" content="#121417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Nexa Control</title>
</head>
<body>
<main>
  <header class="topbar">
    <div>
      <h1 id="page-title">Nexa Control</h1>
      <p id="summary" class="summary">0 outlets · 0 on</p>
    </div>
    <button id="all-off" class="secondary" type="button">All off</button>
    <button id="reorder-done" class="primary" type="button" hidden>Done</button>
  </header>
  <section id="outlet-list" aria-live="polite"></section>
  <button id="add-outlet" class="add-card" type="button">＋ Add outlet</button>
  <div id="reorder-announcement" class="sr-only" aria-live="polite"></div>
</main>

<div id="pair-modal" class="overlay" hidden>
  <form id="pair-form" class="dialog">
    <button class="close-button" type="button" data-close="pair-modal" aria-label="Close">×</button>
    <h2>Pair outlet</h2>
    <label for="pair-name">Outlet name</label>
    <input id="pair-name" type="text" maxlength="80" required>
    <label for="pair-unit">Outlet number</label>
    <select id="pair-unit"></select>
    <ol class="instructions">
      <li>Put the outlet in learning mode.</li>
      <li>Press Pair.</li>
    </ol>
    <div class="dialog-actions">
      <button class="secondary" type="button" data-close="pair-modal">Cancel</button>
      <button class="primary" type="submit">Pair</button>
    </div>
  </form>
</div>

<div id="rename-modal" class="overlay" hidden>
  <form id="rename-form" class="dialog">
    <button class="close-button" type="button" data-close="rename-modal" aria-label="Close">×</button>
    <h2>Edit outlet</h2>
    <label for="rename-name">Outlet name</label>
    <input id="rename-name" type="text" maxlength="80" required>
    <label for="rename-unit">Outlet number</label>
    <select id="rename-unit"></select>
    <div class="dialog-actions">
      <button class="secondary" type="button" data-close="rename-modal">Cancel</button>
      <button class="primary" type="submit">Save</button>
    </div>
  </form>
</div>

<div id="remove-modal" class="overlay" hidden>
  <div class="dialog">
    <button class="close-button" type="button" data-close="remove-modal" aria-label="Close">×</button>
    <h2>Remove outlet?</h2>
    <p id="remove-message" class="muted"></p>
    <div class="dialog-actions">
      <button class="secondary" type="button" data-close="remove-modal">Cancel</button>
      <button id="confirm-remove" class="danger" type="button">Remove</button>
    </div>
  </div>
</div>

<div id="timer-sheet" class="overlay sheet-overlay" hidden>
  <section class="sheet" aria-labelledby="timer-sheet-title">
    <div class="sheet-handle"></div>
    <button class="close-button" type="button" data-close="timer-sheet" aria-label="Close">×</button>
    <h2 id="timer-sheet-title">Timers</h2>
    <div id="timer-list"></div>
    <button id="sheet-add-timer" class="primary full" type="button">＋ Add timer</button>
  </section>
</div>

<div id="editor-sheet" class="overlay sheet-overlay" hidden>
  <form id="timer-form" class="sheet">
    <div class="sheet-handle"></div>
    <button class="close-button" type="button" data-close="editor-sheet" aria-label="Close">×</button>
    <h2 id="editor-title">Add timer</h2>
    <div class="segmented" role="group" aria-label="Timer type">
      <button type="button" data-mode="countdown" aria-pressed="true">In minutes</button>
      <button type="button" data-mode="schedule" aria-pressed="false">At a time</button>
    </div>
    <div class="segmented" role="group" aria-label="Timer action">
      <button type="button" data-action="on" aria-pressed="true">Turn on</button>
      <button type="button" data-action="off" aria-pressed="false">Turn off</button>
    </div>
    <div id="countdown-editor">
      <label for="timer-minutes">Minutes</label>
      <div class="quick-chips">
        <button type="button" data-minutes="15">15 min</button>
        <button type="button" data-minutes="30">30 min</button>
        <button type="button" data-minutes="60">1 h</button>
        <button type="button" data-minutes="120">2 h</button>
      </div>
      <input id="timer-minutes" type="number" min="1" max="1440" value="30">
    </div>
    <div id="schedule-editor" hidden>
      <label for="timer-time">Time</label>
      <input id="timer-time" type="time" value="18:00">
      <span class="field-label">Days</span>
      <div id="timer-days" class="day-pills"></div>
      <div class="quick-chips">
        <button type="button" data-days="every">Every day</button>
        <button type="button" data-days="weekdays">Weekdays</button>
        <button type="button" data-days="weekends">Weekends</button>
      </div>
    </div>
    <div class="dialog-actions">
      <button id="delete-timer" class="danger" type="button" hidden>Delete</button>
      <button class="primary full" type="submit">Save timer</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
