<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <title>Change username - Nexa Control</title>
</head>
<body>
<main class="auth-main password-main">
    <header class="topbar">
        <div class="topbar-title">
            <h1>Change username</h1>
            <p class="summary">Update your sign-in username</p>
        </div>
    </header>
    <a class="settings-back-link" href="{{ url_for('account_settings') }}">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Your account
    </a>
    <section class="dialog auth-card">
        <form id="change-username-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
            <label for="username">Username</label>
            <input id="username" name="username" type="text" value="{{ username }}"
                   minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{2,31}"
                   autocomplete="username" required>
            <label for="current-password">Current password</label>
            <input id="current-password" name="current_password" type="password"
                   autocomplete="current-password" required>
        </form>
        <div class="dialog-actions password-actions">
            <a class="action-button" href="{{ url_for('account_settings') }}">Cancel</a>
            <button class="primary" type="submit" form="change-username-form">Save username</button>
        </div>
    </section>
</main>
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
<script src="{{ url_for('static', filename='theme.js') }}" data-autoload="true"></script>
</body>
</html>
