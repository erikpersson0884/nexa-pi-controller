name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  sonarqube:
    name: Analyze with SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=nexa_pi_controller python -m coverage run --source=nexa_pi_controller -m unittest discover -s tests
          python -m coverage xml -o coverage.xml

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=nexa-web
            -Dsonar.projectName=nexa-web
            -Dsonar.sources=nexa_pi_controller
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.11
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,venv/**,.venv/**,data/**,coverage.xml
